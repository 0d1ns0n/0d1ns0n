<g class="f11"><text class="ln" x="500" y="248">C++</text><rect x="640" y="241" width="220" height="6" rx="3" fill="#ffffff" fill-opacity="0.06"/><rect x="640" y="241" width="154" height="6" rx="3" fill="#f34b7d" filter="url(#glow)"><animate attributeName="width" from="0" to="154" dur="1.2s" begin="0.90s" fill="freeze"/></rect></g>
<g class="f12"><text class="ln" x="500" y="275">C</text><rect x="640" y="268" width="220" height="6" rx="3" fill="#ffffff" fill-opacity="0.06"/><rect x="640" y="268" width="127" height="6" rx="3" fill="#555555" filter="url(#glow)"><animate attributeName="width" from="0" to="127" dur="1.2s" begin="1.02s" fill="freeze"/></rect></g>
