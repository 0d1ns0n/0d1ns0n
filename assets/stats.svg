<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060f"/><stop offset="1" stop-color="#0b0f1f"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00ff9f" stroke-opacity="0.12"/></pattern>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff9f" stop-opacity="0"/><stop offset="0.5" stop-color="#00ff9f" stop-opacity="0.25"/><stop offset="1" stop-color="#00ff9f" stop-opacity="0"/></linearGradient>
<style>text{font-family:"Fira Code","JetBrains Mono",Consolas,monospace}.l{font-size:11px;letter-spacing:3px;fill:#8b93b5}.n{font-size:28px;font-weight:700;fill:#eaf2ff;filter:url(#glow)}.h{font-size:13px;letter-spacing:4px;fill:#00ff9f}.p{font-size:10px;fill:#8b93b5}.ln{font-size:12px;fill:#eaf2ff}.cur{animation:blink 1s infinite steps(1)}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.f0{opacity:0;animation:fi .6s ease-out 0.00s forwards}.f1{opacity:0;animation:fi .6s ease-out 0.12s forwards}.f2{opacity:0;animation:fi .6s ease-out 0.24s forwards}.f3{opacity:0;animation:fi .6s ease-out 0.36s forwards}.f4{opacity:0;animation:fi .6s ease-out 0.48s forwards}.f5{opacity:0;animation:fi .6s ease-out 0.60s forwards}.f6{opacity:0;animation:fi .6s ease-out 0.72s forwards}.f7{opacity:0;animation:fi .6s ease-out 0.84s forwards}.f8{opacity:0;animation:fi .6s ease-out 0.96s forwards}.f9{opacity:0;animation:fi .6s ease-out 1.08s forwards}.f10{opacity:0;animation:fi .6s ease-out 1.20s forwards}.f11{opacity:0;animation:fi .6s ease-out 1.32s forwards}.f12{opacity:0;animation:fi .6s ease-out 1.44s forwards}.f13{opacity:0;animation:fi .6s ease-out 1.56s forwards}
@keyframes fi{to{opacity:1}}</style></defs>
<rect width="900" height="340" fill="url(#bg)"/><rect width="900" height="340" fill="url(#grid)"/>
<rect width="900" height="340" fill="none" stroke="#00ff9f" stroke-opacity="0.5" stroke-width="2"/>
<path d="M0 0H40V4H4V40H0Z M900 0H860V4H896V40H900Z M0 340H40V336H4V300H0Z M900 340H860V336H896V300H900Z" fill="#00ff9f"/>
<text class="h" x="40" y="44">&gt; TELEMETRY // github.com/0d1ns0n<tspan class="cur">_</tspan></text>
<line x1="470" y1="70" x2="470" y2="310" stroke="#00ff9f" stroke-opacity="0.3" stroke-dasharray="4 6"/>
<g class="f0"><text class="l" x="40" y="100">CONTRIBUTIONS</text><text class="n" x="40" y="132">5</text><text class="p" x="40" y="148">last 365 days</text></g>
<g class="f1"><text class="l" x="255" y="100">COMMITS</text><text class="n" x="255" y="132">3</text><text class="p" x="255" y="148">incl. private</text></g>
<g class="f2"><text class="l" x="40" y="176">PULL REQUESTS</text><text class="n" x="40" y="208">0</text><text class="p" x="40" y="224"></text></g>
