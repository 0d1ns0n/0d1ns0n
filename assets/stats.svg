<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060f"/><stop offset="1" stop-color="#0b0f1f"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00ff9f" stroke-opacity="0.12"/></pattern>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff9f" stop-opacity="0"/><stop offset="0.5" stop-color="#00ff9f" stop-opacity="0.25"/><stop offset="1" stop-color="#00ff9f" stop-opacity="0"/></linearGradient>
<style>text{font-family:"Fira Code","JetBrains Mono",Consolas,monospace}.l{font-size:11px;letter-spacing:3px;fill:#8b93b5}.n{font-size:30px;font-weight:700;fill:#eaf2ff;filter:url(#glow)}.h{font-size:13px;letter-spacing:4px;fill:#00ff9f}.p{font-size:11px;fill:#8b93b5}.ln{font-size:12px;fill:#eaf2ff}.cur{animation:blink 1s infinite steps(1)}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.f0{opacity:0;animation:fi .6s ease-out 0.00s forwards}.f1{opacity:0;animation:fi .6s ease-out 0.15s forwards}.f2{opacity:0;animation:fi .6s ease-out 0.30s forwards}.f3{opacity:0;animation:fi .6s ease-out 0.45s forwards}.f4{opacity:0;animation:fi .6s ease-out 0.60s forwards}.f5{opacity:0;animation:fi .6s ease-out 0.75s forwards}.f6{opacity:0;animation:fi .6s ease-out 0.90s forwards}.f7{opacity:0;animation:fi .6s ease-out 1.05s forwards}.f8{opacity:0;animation:fi .6s ease-out 1.20s forwards}.f9{opacity:0;animation:fi .6s ease-out 1.35s forwards}.f10{opacity:0;animation:fi .6s ease-out 1.50s forwards}.f11{opacity:0;animation:fi .6s ease-out 1.65s forwards}
@keyframes fi{to{opacity:1}}</style></defs>
<rect width="900" height="300" fill="url(#bg)"/><rect width="900" height="300" fill="url(#grid)"/>
<rect width="900" height="300" fill="none" stroke="#00ff9f" stroke-opacity="0.5" stroke-width="2"/>
<path d="M0 0H40V4H4V40H0Z M900 0H860V4H896V40H900Z M0 300H40V296H4V260H0Z M900 300H860V296H896V260H900Z" fill="#00ff9f"/>
<text class="h" x="40" y="44">&gt; TELEMETRY // github.com/0d1ns0n<tspan class="cur">_</tspan></text>
<line x1="470" y1="70" x2="470" y2="260" stroke="#00ff9f" stroke-opacity="0.3" stroke-dasharray="4 6"/>
<g class="f0"><text class="l" x="40" y="110">CONTRIBUTIONS</text><text class="n" x="40" y="144">5</text><text class="p" x="40" y="160">last 365 days</text></g>
<g class="f1"><text class="l" x="255" y="110">COMMITS</text><text class="n" x="255" y="144">3</text><text class="p" x="255" y="160">incl. private</text></g>
<g class="f2"><text class="l" x="40" y="200">REPOSITORIES</text><text class="n" x="40" y="234">20</text><text class="p" x="40" y="250">owned</text></g>
<g class="f3"><text class="l" x="255" y="200">LANGUAGES</text><text class="n" x="255" y="234">13</text><text class="p" x="255" y="250">in use</text></g>
<text class="h" x="500" y="88">LANGUAGES</text>
<g class="f6"><text class="ln" x="500" y="122">TypeScript</text><text class="p" x="860" y="122" text-anchor="end">37.0%</text><rect x="500" y="128" width="330" height="6" rx="3" fill="#ffffff" fill-opacity="0.06"/><rect x="500" y="128" width="122" height="6" rx="3" fill="#3178c6" filter="url(#glow)"><animate attributeName="width" from="0" to="122" dur="1.2s" begin="0.30s" fill="freeze"/></rect></g>
<g class="f7"><text class="ln" x="500" y="156">HTML</text><text class="p" x="860" y="156" text-anchor="end">31.6%</text><rect x="500" y="162" width="330" height="6" rx="3" fill="#ffffff" fill-opacity="0.06"/><rect x="500" y="162" width="104" height="6" rx="3" fill="#e34c26" filter="url(#glow)"><animate attributeName="width" from="0" to="104" dur="1.2s" begin="0.45s" fill="freeze"/></rect></g>
<g class="f8"><text class="ln" x="500" y="190">Kotlin</text><text class="p" x="860" y="190" text-anchor="end">15.6%</text><rect x="500" y="196" width="330" height="6" rx="3" fill="#ffffff" fill-opacity="0.06"/><rect x="500" y="196" width="51" height="6" rx="3" fill="#A97BFF" filter="url(#glow)"><animate attributeName="width" from="0" to="51" dur="1.2s" begin="0.60s" fill="freeze"/></rect></g>
<g class="f9"><text class="ln" x="500" y="224">Java</text><text class="p" x="860" y="224" text-anchor="end">9.3%</text><rect x="500" y="230" width="330" height="6" rx="3" fill="#ffffff" fill-opacity="0.06"/><rect x="500" y="230" width="30" height="6" rx="3" fill="#b07219" filter="url(#glow)"><animate attributeName="width" from="0" to="30" dur="1.2s" begin="0.75s" fill="freeze"/></rect></g>
<g class="f10"><text class="ln" x="500" y="258">Rust</text><text class="p" x="860" y="258" text-anchor="end">4.5%</text><rect x="500" y="264" width="330" height="6" rx="3" fill="#ffffff" fill-opacity="0.06"/><rect x="500" y="264" width="14" height="6" rx="3" fill="#dea584" filter="url(#glow)"><animate attributeName="width" from="0" to="14" dur="1.2s" begin="0.90s" fill="freeze"/></rect></g>
<g class="f11"><text class="ln" x="500" y="292">Python</text><text class="p" x="860" y="292" text-anchor="end">0.7%</text><rect x="500" y="298" width="330" height="6" rx="3" fill="#ffffff" fill-opacity="0.06"/><rect x="500" y="298" width="4" height="6" rx="3" fill="#3572A5" filter="url(#glow)"><animate attributeName="width" from="0" to="4" dur="1.2s" begin="1.05s" fill="freeze"/></rect></g>
<rect width="900" height="50" fill="url(#scan)"><animate attributeName="y" values="-50;300" dur="4s" repeatCount="indefinite"/></rect></svg>